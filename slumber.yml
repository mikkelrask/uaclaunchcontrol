name: UAC Launch Control

profiles:
  local:
    name: local
    data:
      host: http://localhost:7666
      protocol_id: protocol-id-here
      version_slug: gzdoom
      catalog_file_id: 1
      image_filename: image.png

requests:
  # ==========
  # Core API
  # ==========

  post_dialog_open:
    name: 'POST /dialog/open'
    method: POST
    url: '{{ host }}/dialog/open'
    body:
      type: json
      data:
        properties: ['openFile']
        filters:
          - name: 'All Files'
            extensions: ['*']

  # ===========
  # Files API
  # ===========

  post_file_read:
    name: 'POST /file-read'
    method: POST
    url: '{{ host }}/file-read'

  post_wads_import:
    name: 'POST /wads/import'
    method: POST
    url: '{{ host }}/wads/import'

  get_mod_files_catalog:
    name: 'GET /mod-files/catalog'
    method: GET
    url: '{{ host }}/mod-files/catalog'

  post_mod_files_catalog:
    name: 'POST /mod-files/catalog'
    method: POST
    url: '{{ host }}/mod-files/catalog'
    body:
      type: json
      data:
        filePath: 'mods/file.ext'
        fileName: 'file.ext'
        fileType: 'file'

  post_mod_files_move:
    name: 'POST /mod-files/move'
    method: POST
    url: '{{ host }}/mod-files/move'

  post_mod_files_hash:
    name: 'POST /mod-files/hash'
    method: POST
    url: '{{ host }}/mod-files/hash'

  put_mod_files_catalog_id:
    name: 'PUT /mod-files/catalog/{{ id }}'
    method: PUT
    url: '{{ host }}/mod-files/catalog/{{ id }}'
    body:
      type: json
      data:
        fileType: 'file'
        fileOrder: 1

  delete_mod_files_catalog_id:
    name: 'DELETE /mod-files/catalog/{{ id }}'
    method: DELETE
    url: '{{ host }}/mod-files/catalog/{{ id }}'

  # ==============
  # Settings API
  # ==============

  get_settings:
    name: 'GET /settings'
    method: GET
    url: '{{ host }}/settings'

  put_settings:
    name: 'PUT /settings'
    method: PUT
    url: '{{ host }}/settings'
    body:
      type: json
      data:
        key: 'value'

  # ===========
  # Media API
  # ===========

  get_media:
    name: 'GET /media'
    method: GET
    url: '{{ host }}/media'

  get_images_filename:
    name: 'GET /images/{{ fileName }}'
    method: GET
    url: '{{ host }}/images/{{ fileName }}'

  post_screenshots_upload:
    name: 'POST /screenshots/upload'
    method: POST
    url: '{{ host }}/screenshots/upload'

  # ===============
  # Protocols API
  # ===============

  post_protocol_download_image:
    name: 'POST /protocol/download-image'
    method: POST
    url: '{{ host }}/protocol/download-image'

  get_protocols:
    name: 'GET /protocols'
    method: GET
    url: '{{ host }}/protocols'

  get_protocols_id:
    name: 'GET /protocols/{{ id }}'
    method: GET
    url: '{{ host }}/protocols/{{ id }}'

  post_protocols:
    name: 'POST /protocols'
    method: POST
    url: '{{ host }}/protocols'
    body:
      type: json
      data:
        title: 'My Resource'
        files: []

  put_protocols_id:
    name: 'PUT /protocols/{{ id }}'
    method: PUT
    url: '{{ host }}/protocols/{{ id }}'
    body:
      type: json
      data:
        title: 'Updated Resource'
        files:
          - filePath: 'data/file.ext'
            fileType: 'file'

  delete_protocols_id:
    name: 'DELETE /protocols/{{ id }}'
    method: DELETE
    url: '{{ host }}/protocols/{{ id }}'

  post_protocols_id_launch:
    name: 'POST /protocols/{{ id }}/launch'
    method: POST
    url: '{{ host }}/protocols/{{ id }}/launch'

  # ==============
  # Versions API
  # ==============

  get_versions:
    name: 'GET /versions'
    method: GET
    url: '{{ host }}/versions'

  put_versions:
    name: 'PUT /versions'
    method: PUT
    url: '{{ host }}/versions'
    body:
      type: json
      data:
        - id: 'example'
          name: 'Example Version'
          slug: 'example'

  get_versions_slug:
    name: 'GET /versions/{{ slug }}'
    method: GET
    url: '{{ host }}/versions/{{ slug }}'

  put_versions_id:
    name: 'PUT /versions/{{ id }}'
    method: PUT
    url: '{{ host }}/versions/{{ id }}'
    body:
      type: json
      data:
        ignore: true

  # ===============
  # Migration API
  # ===============

  get_migration_check:
    name: 'GET /migration/check'
    method: GET
    url: '{{ host }}/migration/check'

  post_migration_execute:
    name: 'POST /migration/execute'
    method: POST
    url: '{{ host }}/migration/execute'

