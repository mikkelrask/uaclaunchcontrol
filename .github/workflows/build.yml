name: Build & Release

on:
  push:
    branches:
      - production
    tags:
      - 'v*'
      - 'E*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Setup App Icons for Build
        run: |
          mkdir -p build/icons
          cp resources/icon-*.png build/icons/
          echo "✅ Copied icon sizes to build/icons/"

      - name: Build Application
        run: npm run build

      - name: Build Electron packages
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
