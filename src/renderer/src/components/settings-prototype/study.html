#uac-study{width:100%;color-scheme:dark}
#uac-study *{box-sizing:border-box}
#uac-study [hidden]{display:none!important}
#uac-study .uac{--u-bg:#171b1e;--u-surface:#20262a;--u-line:#374149;--u-text:#edf0eb;--u-muted:#a4afb6;--u-accent:#48c9e9;--u-amber:#efb556;--u-radius:6px;--u-body:system-ui,sans-serif;font:14px/1.45 var(--u-body);color:var(--u-text);background:var(--u-bg);border:1px solid var(--u-line);border-radius:10px;overflow:hidden;min-height:740px;display:flex;flex-direction:column}
#uac-study button,#uac-study input,#uac-study select,#uac-study textarea{font:inherit}
#uac-study button{cursor:inherit}
#uac-study button:focus-visible,#uac-study input:focus-visible,#uac-study select:focus-visible,#uac-study textarea:focus-visible,#uac-study summary:focus-visible{outline:2px solid var(--u-accent);outline-offset:3px}
#uac-study .top{display:flex;align-items:center;gap:15px;padding:20px 24px;border-bottom:1px solid var(--u-line);background:var(--u-surface)}
#uac-study .brand{width:34px;height:34px;object-fit:contain;filter:brightness(0) invert(.92)}
#uac-study h1,#uac-study h2,#uac-study h3,#uac-study p{margin:0}
#uac-study h1{font:22px/1.15 UACAldrich,sans-serif;letter-spacing:-.6px}
#uac-study .sys{font:10px/1.6 ui-monospace,monospace;color:var(--u-muted);letter-spacing:1.3px;text-transform:uppercase}
#uac-study .top .sys{margin-top:5px}
#uac-study .head-end{margin-left:auto;display:flex;align-items:center;gap:10px}
#uac-study .tag{font:11px ui-monospace,monospace;padding:5px 7px;border:1px solid var(--u-line);border-radius:3px;color:var(--u-muted);white-space:nowrap}
#uac-study .close{border:0;background:transparent;color:var(--u-muted);width:32px;height:32px;font-size:24px}
#uac-study .body{display:grid;grid-template-columns:156px minmax(0,1fr);flex:1}
#uac-study .nav{padding:22px 12px;background:#1c2125;border-right:1px solid var(--u-line);display:flex;flex-direction:column;align-items:stretch;gap:5px}
#uac-study .nav button{display:flex;align-items:center;gap:10px;background:transparent;border:1px solid transparent;border-radius:4px;color:var(--u-muted);text-align:left;padding:11px 10px;font-size:13px;min-height:40px}
#uac-study .nav button[aria-current="page"]{color:var(--u-text);background:#26343b;border-color:#35464e;box-shadow:inset 2px 0 var(--u-accent)}
#uac-study .nav svg{width:16px;height:16px;flex-shrink:0}
#uac-study .nav-caption{margin:0 10px 10px}
#uac-study .nav-foot{margin-top:auto;padding:36px 10px 0}
#uac-study .keycard{color:var(--u-accent)!important;border:1px solid var(--u-line)!important;font:10px ui-monospace,monospace!important;text-align:center!important;justify-content:center}
#uac-study .nav-foot p{font-size:11px;color:var(--u-muted);margin-top:10px}
#uac-study .content{padding:25px 28px 32px;min-width:0}
#uac-study .section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}
#uac-study h2{font:22px/1.25 UACAldrich,sans-serif;letter-spacing:-.3px}
#uac-study .intro{color:var(--u-muted);font-size:12px;margin-top:6px;max-width:62ch}
#uac-study .group{margin-top:24px}
#uac-study .group:first-child{margin-top:0}
#uac-study .group-title{display:flex;align-items:center;gap:10px;padding-bottom:9px;border-bottom:1px solid var(--u-line)}
#uac-study h3{font:13px/1.4 UACAldrich,sans-serif;color:var(--u-text)}
#uac-study .group-title small{color:var(--u-muted);font-size:11px;margin-left:auto}
#uac-study .setting{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,44%);align-items:center;gap:20px;min-height:72px;padding:14px 0;border-bottom:1px solid #2b3338}
#uac-study .setting:last-child{border-bottom:0}
#uac-study .label{font-weight:500;display:block;font-size:13px}
#uac-study .hint{color:var(--u-muted);font-size:12px;display:block;margin-top:4px;line-height:1.45}
#uac-study .control{width:100%;min-width:0;color:var(--u-text);background:#14181b;border:1px solid #46515a;border-radius:var(--u-radius);padding:9px 10px;min-height:38px;font-size:13px}
#uac-study input.control{font-size:12px}
#uac-study .mono{font-family:"DejaVu Sans Mono",monospace;font-size:12px;letter-spacing:0}
#uac-study .button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:7px 11px;border:1px solid #46515a;border-radius:var(--u-radius);color:var(--u-text);background:#232a2f;white-space:nowrap;font-size:12px;text-decoration:none}
#uac-study .button:hover{background:#2d373e}
#uac-study .button.primary{background:var(--u-accent);border-color:var(--u-accent);color:#0a252d;font-weight:650}
#uac-study .button:disabled{opacity:.4;cursor:default}
#uac-study .button.quiet{background:transparent;border-color:transparent;color:var(--u-muted)}
#uac-study .button.danger{color:#f0aaa5}
#uac-study .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#uac-study .control-stack{display:flex;flex-direction:column;gap:7px;min-width:0}
#uac-study .text-link{background:none;border:0;padding:0;color:var(--u-accent);font-size:11px;align-self:flex-end;text-decoration:underline;text-underline-offset:3px}
#uac-study .segments{display:flex;border:1px solid #46515a;border-radius:var(--u-radius);padding:3px;background:#14181b}
#uac-study .segments button{flex:1;border:0;padding:6px 8px;border-radius:3px;color:var(--u-muted);background:none;font-size:12px}
#uac-study .segments button[aria-pressed="true"]{color:var(--u-text);background:#33434d}
#uac-study .switch{justify-self:end;position:relative;display:block;width:36px;height:21px;appearance:none;border-radius:20px;background:#404a51;border:1px solid #65727c}
#uac-study .switch:checked{background:var(--u-accent);border-color:var(--u-accent)}
#uac-study .switch:after{content:"";position:absolute;width:15px;height:15px;top:2px;left:2px;border-radius:50%;background:#eef2f0}
#uac-study .switch:checked:after{left:17px;background:#14323b}
#uac-study .range{display:flex;gap:12px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}
#uac-study input[type="range"]{accent-color:var(--u-accent);width:100%;min-width:0}
#uac-study .path-row{padding:17px 0;border-bottom:1px solid #2b3338}
#uac-study .path-row .label{margin-bottom:7px}
#uac-study .path-input{display:flex;gap:8px;align-items:center}
#uac-study .path-input .control{flex:1;min-width:0}
#uac-study .note{margin-top:20px;border-left:2px solid var(--u-amber);padding:2px 0 2px 12px;color:var(--u-muted);font-size:12px}
#uac-study .footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 23px;background:var(--u-surface);border-top:1px solid var(--u-line);margin-top:auto}
#uac-study .save-state{font-size:11px;color:var(--u-muted)}
#uac-study .save-state.changed{color:var(--u-amber)}
#uac-study .footer .button{min-height:37px}
#uac-study .resource-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:15px}
#uac-study .resource-toolbar .hint{margin:0}
#uac-study .resource-list{border-top:1px solid var(--u-line)}
#uac-study .resource{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:13px 10px;border:0;border-bottom:1px solid var(--u-line);color:var(--u-text);background:transparent;width:100%;text-align:left;align-items:center;min-height:62px;border-radius:0}
#uac-study .resource:hover,#uac-study .resource.selected{background:#243039}
#uac-study .resource.selected{box-shadow:inset 2px 0 var(--u-accent)}
#uac-study .resource .sub{display:block;color:var(--u-muted);font:12px/1.5 "DejaVu Sans Mono",monospace;margin-top:5px;overflow-wrap:anywhere}
#uac-study .resource .name{font-size:13px;font-weight:500}
#uac-study .badge{font:10px ui-monospace,monospace;padding:3px 5px;border:1px solid #55636b;color:#d3dcd9;border-radius:3px;display:inline-block;white-space:nowrap}
#uac-study .badge.default{color:var(--u-accent);border-color:#396471}
#uac-study .resource-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
#uac-study .inspector{padding:18px;background:#20262a;border:1px solid var(--u-line);border-radius:var(--u-radius);min-width:0}
#uac-study .inspector h3{font-size:15px;margin-bottom:6px}
#uac-study .inspector .field{display:block;margin-top:15px}
#uac-study .inspector .field .label{margin-bottom:6px;font-size:12px}
#uac-study .inspector .actions{margin-top:18px}
#uac-study .game-list .resource{grid-template-columns:28px minmax(0,1fr) auto}
#uac-study .game-list img{width:26px;height:30px;object-fit:contain;image-rendering:pixelated}
#uac-study .game-hero{display:flex;align-items:center;gap:14px;margin-bottom:17px}
#uac-study .game-hero img{width:52px;height:52px;object-fit:contain;image-rendering:pixelated}
#uac-study .compact-strip{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 0;border-top:1px solid var(--u-line);margin-top:20px}
#uac-study .compact-strip .hint{font-size:11px}
#uac-study .code{width:100%;min-height:265px;resize:vertical;line-height:1.7;font:12px/1.75 ui-monospace,monospace;padding:14px;color:#b9d9dc;border:1px solid #46515a;background:#12171a;border-radius:var(--u-radius)}
#uac-study .theme-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
#uac-study .swatches{display:flex;gap:7px;margin:13px 0}
#uac-study .swatches span{height:23px;flex:1;border-radius:3px;border:1px solid #617079}
#uac-study .preview{padding:19px;background:#20262a;border:1px solid var(--u-line);border-radius:var(--u-radius)}
#uac-study .preview .sys{margin-bottom:12px}
#uac-study .preview h3{font-size:18px;margin-bottom:5px}
#uac-study .preview .button{margin-top:18px}
#uac-study details{margin-top:18px;font-size:12px;color:var(--u-muted)}
#uac-study summary{color:var(--u-text)}
#uac-study details p{margin-top:9px}
#uac-study .toast{padding:11px 16px;background:#213841;border-top:1px solid #3d6a77;font:12px ui-monospace,monospace;color:#a4e4f0}
#uac-study .flavour{font-family:UACAldrich,sans-serif}
#uac-study .closed{padding:40px;text-align:center;min-height:500px;display:grid;place-content:center;gap:20px}
/* Terminal refit: familiar horizontal navigation; section descriptions form a quiet left column. */
#uac-study .refit .body{display:flex;flex-direction:column}
#uac-study .refit .nav{flex-direction:row;padding:0 24px;border-right:0;border-bottom:1px solid var(--u-line);gap:18px;background:var(--u-bg);flex-wrap:wrap}
#uac-study .refit .nav button{padding:15px 0;border-radius:0;font-family:UACAldrich,sans-serif;border:0;border-bottom:2px solid transparent}
#uac-study .refit .nav button[aria-current="page"]{background:none;box-shadow:none;border-bottom-color:var(--u-accent)}
#uac-study .refit .nav-caption,#uac-study .refit .nav-foot,#uac-study .refit .nav svg{display:none}
#uac-study .refit .content{padding:26px 30px 34px}
#uac-study .refit .group{display:grid;grid-template-columns:145px minmax(0,1fr);gap:28px;border-bottom:1px solid var(--u-line);padding:0 0 18px}
#uac-study .refit .group-title{display:block;border:0;padding-top:15px}
#uac-study .refit .group-title small{display:block;margin-top:7px;line-height:1.5}
#uac-study .refit .setting{min-height:67px}
#uac-study .refit .section-head{margin-bottom:17px}
#uac-study .refit .game-layout{grid-template-columns:230px minmax(0,1fr)}
/* Maintenance workbench: compact top navigation, property sheet and a visible inspector. */
#uac-study .bench .top{padding:15px 22px}
#uac-study .bench .body{display:flex;flex-direction:column}
#uac-study .bench .nav{flex-direction:row;padding:10px 20px;border-right:0;border-bottom:1px solid var(--u-line);gap:6px;flex-wrap:wrap}
#uac-study .bench .nav button{padding:7px 12px;min-height:33px;font-size:12px}
#uac-study .bench .nav button[aria-current="page"]{box-shadow:none;border-color:#536471;background:#303d46}
#uac-study .bench .nav-caption,#uac-study .bench .nav-foot{display:none}
#uac-study .bench .content{padding:21px 24px}
#uac-study .bench .section-head{margin-bottom:19px}
#uac-study .bench .bench-grid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px}
#uac-study .bench .setting{min-height:57px;padding:10px 0;gap:14px}
#uac-study .bench .setting .hint{display:none}
#uac-study .bench .group{margin-top:20px}
#uac-study .bench .group:first-child{margin-top:0}
#uac-study .bench .resource-layout{grid-template-columns:minmax(0,1fr) 270px;gap:20px}
#uac-study .bench .resource .sub{font-size:12px}
#uac-study .bench .resource{min-height:55px;padding:11px 10px}
#uac-study .bench .inspector{border:0;border-left:1px solid var(--u-line);border-radius:0;background:none;padding:0 0 0 20px}
#uac-study .bench .path-row{display:grid;grid-template-columns:105px minmax(0,1fr);gap:8px 15px;align-items:center}
#uac-study .bench .path-row .hint{grid-column:2}
#uac-study .bench .path-row .label{margin:0}
#uac-study .bench .theme-grid{grid-template-columns:minmax(0,1fr) 220px}
@container uacview (min-width:860px){#uac-study .console .body{grid-template-columns:185px minmax(0,1fr)}#uac-study .console .game-layout{grid-template-columns:220px minmax(0,1fr)}#uac-study .console .theme-grid{grid-template-columns:minmax(0,1fr) 210px}}
#uac-study .stage{container-type:inline-size;container-name:uacview;min-height:1050px}
@container uacview (max-width:650px){#uac-study .body{display:flex;flex-direction:column}#uac-study .nav{flex-direction:row;padding:8px 14px;gap:5px;border-right:0;border-bottom:1px solid var(--u-line);flex-wrap:wrap}#uac-study .nav button{padding:8px;min-height:34px}#uac-study .nav-caption,#uac-study .nav-foot,#uac-study .nav svg{display:none}#uac-study .content{padding:22px 20px}#uac-study .refit .group{display:block}#uac-study .refit .group-title{padding-top:0}#uac-study .refit .group-title small{display:none}#uac-study .bench .bench-grid,#uac-study .bench .resource-layout,#uac-study .refit .game-layout,#uac-study .bench .theme-grid{grid-template-columns:1fr}#uac-study .bench .inspector{border:1px solid var(--u-line);padding:18px}#uac-study .bench .preview-side{display:none}}
@container uacview (max-width:440px){#uac-study .top{padding:16px;gap:10px}#uac-study h1{font-size:20px}#uac-study .head-end .tag{display:none}#uac-study .sys{font-size:9px;letter-spacing:.7px}#uac-study .content{padding:22px 16px}#uac-study .setting{grid-template-columns:1fr;gap:9px}#uac-study .setting:has(.switch){grid-template-columns:minmax(0,1fr) auto}#uac-study .footer{padding:14px 16px;flex-wrap:wrap}#uac-study .save-state{width:100%}#uac-study .footer .actions{margin-left:auto}#uac-study .refit .nav{gap:12px;padding:0 16px}#uac-study .refit .nav button{font-size:11px;padding:12px 0}#uac-study .nav button{font-size:11px}#uac-study .bench .path-row{display:block}#uac-study .bench .path-row .label{margin-bottom:8px}#uac-study .resource .name{font-size:12px}#uac-study .section-head .tag{display:none}#uac-study .button{white-space:normal}#uac-study .compact-strip{flex-wrap:wrap}}
</style>

 const input=(key,extra='')=>`<input id="${uid}-${key}" data-key="${key}" class="control ${extra}" value="${esc(state[key])}">`;
 const heading=(title,intro,tag='')=>`<div class="section-head"><div><h2>${title}</h2><p class="intro">${intro}</p></div>${tag?`<span class="tag">${tag}</span>`:''}</div>`;
 const preview=()=>`<div class="preview"><div class="sys">Interface sample</div><h3>Ready to deploy</h3><p class="hint">Ultimate Doom / UZDoom</p><div class="swatches"><span style="background:#171b1e"></span><span style="background:#374149"></span><span style="background:#edf0eb"></span><span style="background:#48c9e9"></span></div>${button('Launch protocol','sample-launch','primary')}<p class="hint">Preview only</p></div>`;
 function general(){
 const appearance=group('Appearance','Your working environment',field('theme','App theme','Colour profile for the launcher.',`<div class="control-stack">${select('theme',['UAC Industrial','Dark','Light','Custom'])}<button class="text-link cursor-interaction" data-page="theme">Edit custom theme</button></div>`)+field('scale','Interface scale','Text and spacing across the launcher.',`<div class="range"><input id="${uid}-scale" type="range" min="80" max="150" step="5" value="${state.scale}" data-key="scale"><output>${state.scale}%</output></div>`));
 const launch=group('Launch behaviour','Defaults for the next mission',field('view','Default view','Initial layout of your game library.',`<div class="segments" role="group" aria-label="Default view">${['Grid','List','Detail'].map(v=>`<button class="cursor-interaction" data-view="${v}" aria-pressed="${state.view===v}">${v}</button>`).join('')}</div>`)+field('preview','Launch command preview','Show the generated engine command.',toggle('preview')));
 const connection=group('Connections','Optional external services',field('database','Database shortcut','Link next to Launch and Install.',select('database',['ModDB','Doomworld','ZDoom','itch.io']))+field('registry','Registry lookup','Identify files using the UAC Registry.',toggle('registry'))+field('updates','Check for updates on startup','Downloads always need your approval.',toggle('updates')));
 const bottom=`<div class="compact-strip"><div><span class="label">Application updates</span><span class="hint">Installed build E1M1.0.0</span></div>${button('Check now','check-update')}</div>`;
 const body=appearance+launch+connection+bottom;
 return heading('General','Set up your working environment.','LOCAL CONFIG')+(app.dataset.mode==='bench'?`<div class="bench-grid"><div>${body}</div><aside class="preview-side">${preview()}<div class="note">Theme and scale preview while you edit. Apply saves your preferences.</div></aside></div>`:body);
 }
 function paths(){
 const items=[['wad','WAD assets','Base-game IWADs and playable .wad / .pk3 files.'],['mods','Mod configurations','Your saved mod setups and launch protocols.'],['saves','Save files','Where supported engines store game progress.'],['screens','Screenshots','Captures from your expeditions.']];
 return heading('Paths','Keep your assets and mission records in order.','DATA STORAGE')+items.map(([key,label,hint])=>`<div class="path-row"><label class="label" for="${uid}-${key}">${label}</label><div class="path-input">${input(key,'mono')}${button('Browse',`browse-${key}`)}</div><span class="hint">${hint}</span></div>`).join('')+`<div class="note">Changing WAD assets rescans that folder on Apply. Finish any base-game edits first.</div><div class="compact-strip"><div><span class="label">Application configuration</span><span class="hint mono">/home/mr/.config/uac</span></div>${button('Open folder','open-config','quiet')}</div>`;
 }
 function ports(){
 const p=portData[port];
 return heading('Source ports','Choose an engine. Keep its details close at hand.',`${portData.length} ENGINES`)+`<div class="resource-toolbar"><span class="hint">Default applies to new protocols</span><div class="actions">${button('Scan PATH','scan')}${button('Get port','get-port')}${button('+ Add','add-port')}</div></div><div class="resource-layout"><div class="resource-list">${portData.map((r,i)=>`<button class="resource cursor-interaction ${port===i?'selected':''}" data-port="${i}" aria-pressed="${port===i}"><span><span class="name">${esc(state.portNames?.[i]??r[0])}</span><span class="sub">${r[1]} &nbsp; / &nbsp; ${esc(r[3])}</span></span><span class="badge ${state.portDefault===i?'default':''}">${state.portDefault===i?'Default':r[2]}</span></button>`).join('')}</div><aside class="inspector"><div class="sys">Selected engine</div><h3>${esc(p[0])}</h3><span class="hint">${p[2]} / ${p[1]}</span><label class="field"><span class="label">Display name</span><input class="control" data-key="portName" value="${esc(state.portNames?.[port]??p[0])}"></label><label class="field"><span class="label">Executable</span><input class="control mono" data-key="portPath" value="${esc(state.portPaths?.[port]??p[3])}"></label><div class="actions">${state.portDefault===port?'<span class="badge default">Default for new protocols</span>':button('Make default','port-default')}${button('More options','port-options','quiet')}</div></aside></div><p class="note">Adding or editing entries is staged. Engine downloads start separately.</p>`;
 }
 function games(){
 const g=gameData[game];
 return heading('Base games','IWAD identities, defaults and launch options.',`${gameData.length} GAMES`)+`<div class="resource-layout game-layout"><div class="resource-list game-list">${gameData.map((r,i)=>`<button class="resource cursor-interaction ${game===i?'selected':''}" data-game="${i}" aria-pressed="${game===i}"><img src="${assets[r[2]]}" alt=""><span><span class="name">${esc(state.gameNames?.[i]??r[0])}</span><span class="sub">${r[1]}</span></span>${state.gameDefault===i?'<span class="badge default">Default</span>':'<span></span>'}</button>`).join('')}</div><aside class="inspector"><div class="game-hero"><img src="${assets[g[2]]}" alt=""><div><div class="sys">Selected base game</div><h3>${esc(g[0])}</h3>${state.gameDefault===game?'<span class="badge default">Default for new protocols</span>':button('Make default','game-default')}</div></div><label class="field"><span class="label">Display name</span><input class="control" data-key="gameName" value="${esc(state.gameNames?.[game]??`${g[0]} (${g[1]})`)}"></label><label class="field"><span class="label">Launch arguments</span><input class="control mono" data-key="launchArgs" value="${esc(state.launchArgsByGame?.[game]??`-iwad /home/mr/.config/uac/wads/${g[3]}`)}"></label><label class="field"><span class="label">Additional parameters</span><input class="control mono" placeholder="e.g. -nomonsters -warp 01" data-key="args" value="${esc(state.argsByGame?.[game]??'')}"></label>${field('gameHidden','Hide from library','Keep the configuration available here.',`<input id="${uid}-gameHidden" class="switch cursor-interaction" type="checkbox" role="switch" data-key="gameHidden" ${state.gameHiddenByGame?.[game]?'checked':''}>`)}<div class="hint mono">File source: ${esc(g[3])}</div></aside></div><div class="compact-strip"><div><span class="label">FreeDoom &amp; FreeDM</span><span class="hint">Free base games. Installed in this sample.</span></div><span class="badge">Installed</span></div>`;
 }
 function theme(){
 return heading('Theme lab','Tune the terminal. Preview before committing.','CUSTOM PALETTE')+`<div class="theme-grid"><div><label class="label" for="${uid}-css">Custom CSS variables</label><p class="hint" style="margin:6px 0 12px">HSL values. Wrapped in <span class="mono">.custom { }</span>.</p><textarea id="${uid}-css" class="code" spellcheck="false" data-key="css">${esc(state.css)}</textarea><div class="actions" style="margin-top:12px">${button('Wrap in .custom','wrap')}${button('Reset draft','reset-theme','quiet')}</div></div><aside>${preview()}<p class="hint" style="margin-top:12px">Component preview is illustrative in this study.</p></aside></div><details><summary>Syntax and variable reference</summary><p>One variable per line: <code>--primary: 192 79% 60%;</code> Colours use hue, saturation and lightness. Surface, text and control colours should be tuned together.</p><p>Final implementation should use the existing theme variables and preserve the live preview / cancel behaviour.</p></details>`;
 }
 function dirty(){return Object.keys({...state,...saved}).filter(k=>JSON.stringify(state[k])!==JSON.stringify(saved[k])).length}
 function status(){const n=dirty();app.querySelector('.save-state').textContent=n?`${n} unsaved ${n===1?'change':'changes'}`:'Configuration up to date';app.querySelector('.save-state').classList.toggle('changed',n>0);app.querySelector('[data-action="apply"]').disabled=!n}
 function render(){
 if(closed){app.innerHTML=`<div class="closed"><h2>Settings closed</h2><p class="hint">Design preview only. Launcher files were never changed.</p>${button('Reopen settings','reopen')}</div>`;return}
 app.innerHTML=`<header class="top"><img class="brand" src="${assets.logo}" alt="UAC"><div><h1>core_settings</h1><div class="sys">UAC Launch Control / System configuration</div></div><div class="head-end"><span class="tag">E1M1.0.0</span><button class="close cursor-interaction" aria-label="Close settings" data-action="close">×</button></div></header><div class="body"><nav class="nav" aria-label="Settings sections"><div class="sys nav-caption">Configuration</div>${pages.map(([id,name,icon])=>`<button class="cursor-interaction" data-page="${id}" ${page===id?'aria-current="page"':''}><i data-lucide="${icon}" aria-hidden="true"></i>${name}</button>`).join('')}<div class="nav-foot"><button class="keycard cursor-interaction" data-action="keycard">RESTRICTED ACCESS</button><p>Authorised personnel only.<br>That means you. Probably.</p></div></nav><main class="content">${({general,paths,ports,games,theme})[page]()}</main></div>${toast?`<div class="toast" role="status">${esc(toast)}</div>`:''}<footer class="footer"><span class="save-state" aria-live="polite"></span><div class="actions">${button('Cancel','cancel','quiet')}${button('Apply changes','apply','primary')}</div></footer>`;
 status();icons();
 }
 app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.page){page=b.dataset.page;toast='';render();return}
 if(b.dataset.port!==undefined){port=Number(b.dataset.port);render();return}
 if(b.dataset.game!==undefined){game=Number(b.dataset.game);render();return}
 if(b.dataset.view){state.view=b.dataset.view;render();return}
 const a=b.dataset.action;
 if(a==='apply'){saved=structuredClone(state);toast='CONFIGURATION COMMITTED / Preview state only';render();return}
 if(a==='cancel'){state=structuredClone(saved);toast='Draft changes discarded / Preview state only';render();return}
 if(a==='close'){if(dirty()){toast='Unsaved changes: Apply or Cancel before closing this preview.';render()}else{closed=true;render()}return}
 if(a==='reopen'){closed=false;render();return}
 if(a==='port-default')state.portDefault=port;
 if(a==='game-default')state.gameDefault=game;
 if(a==='reset-theme')state.css=base.css;
 if(a==='wrap'&&!state.css.trim().startsWith('.custom'))state.css=`.custom {\n${state.css}\n}`;
 const messages={'keycard':'BLUE KEYCARD REQUIRED / Clearance level: disappointingly ordinary.','check-update':'UPDATE QUERY / Demo only. No network request sent.','scan':'PATH SCAN / Preview only. No executables were scanned.','get-port':'PORT ACQUISITION / This would open the engine download chooser.','add-port':'REGISTER ENGINE / This would open the name, family and executable form.','port-options':'ENGINE ACTIONS / Hide from launcher · Edit family/version · Remove from launcher.','sample-launch':'LAUNCH PREVIEW / No demons were disturbed.','open-config':'CONFIG DIRECTORY / Preview only. No folder was opened.'};
 toast=messages[a]||(a?.startsWith('browse-')?'DIRECTORY PICKER / Preview only. Edit the path field to try a draft change.':'');render();
 });
 app.addEventListener('input',e=>{const el=e.target,key=el.dataset.key;if(!key)return;const value=el.type==='checkbox'?el.checked:el.type==='range'?Number(el.value):el.value;
 const maps={portName:['portNames',port],portPath:['portPaths',port],gameName:['gameNames',game],launchArgs:['launchArgsByGame',game],args:['argsByGame',game],gameHidden:['gameHiddenByGame',game]};
 if(maps[key]){const [k,i]=maps[key];state[k]={...state[k],[i]:value}}else state[key]=value;
 if(key==='scale')el.nextElementSibling.textContent=value+'%';status();
 });
 render();
 if(globalThis.Tweak){const opts={accent:'#48c9e9',radius:6,body:'Readable body'};const tweak=new Tweak({container:app,onChange:()=>{app.style.setProperty('--u-accent',opts.accent);app.style.setProperty('--u-radius',opts.radius+'px');app.style.setProperty('--u-body',opts.body==='All Aldrich'?'UACAldrich, sans-serif':'system-ui, sans-serif')}});tweak.addColorPicker(opts,'accent',{label:'Control accent'});tweak.addSlider(opts,'radius',{label:'Control corners',min:2,max:12,unit:'px'});tweak.addSelect(opts,'body',{label:'Body typography',options:['Readable body','All Aldrich']})}
});
})();
</script>
