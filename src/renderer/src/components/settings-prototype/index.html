&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },
      );
    }
    state = storedState;
    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

#uac-revision{container-type:inline-size;container-name:workbench;width:100%;color-scheme:dark}
#uac-revision *{box-sizing:border-box}
#uac-revision [hidden]{display:none!important}
#uac-revision .uac{--u-bg:#171b1e;--u-panel:#20262a;--u-line:#39434b;--u-text:#edf0eb;--u-muted:#adb7bd;--u-accent:#48c9e9;--u-field:#14181b;--u-selected:#303d46;--u-hover:#252e34;--u-radius:5px;--u-body:system-ui,sans-serif;--u-height:840px;height:var(--u-height);min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--u-bg);color:var(--u-text);border:1px solid var(--u-line);border-radius:9px;font:14px/1.5 var(--u-body)}
#uac-revision h1,#uac-revision h2,#uac-revision h3,#uac-revision p{margin:0}
#uac-revision button,#uac-revision input,#uac-revision select,#uac-revision textarea{font:inherit}
#uac-revision button{cursor:inherit}
#uac-revision :is(button,input,select,textarea,summary):focus-visible{outline:2px solid var(--u-accent);outline-offset:2px}
#uac-revision svg{width:16px;height:16px;flex:none}
#uac-revision .top{flex:none;display:flex;align-items:center;gap:14px;padding:18px 23px;background:var(--u-panel);border-bottom:1px solid var(--u-line)}
#uac-revision .brand{width:34px;height:34px;object-fit:contain;filter:brightness(0) invert(.92)}
#uac-revision h1{font:23px/1.2 UACAldrich,sans-serif;letter-spacing:-.4px}
#uac-revision .sys{font:11px/1.5 ui-monospace,monospace;letter-spacing:.7px;color:var(--u-muted)}
#uac-revision .top .sys{margin-top:5px}
#uac-revision .close{margin-left:auto;border:0;background:none;color:var(--u-muted);width:32px;height:32px;font-size:24px}
#uac-revision .nav{flex:none;display:flex;align-items:stretch;gap:5px;padding:10px 20px;flex-wrap:wrap;border-bottom:1px solid var(--u-line);background:var(--u-panel)}
#uac-revision .nav button{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--u-radius);padding:8px 11px;min-height:36px;background:none;color:var(--u-muted);font-size:12px}
#uac-revision .nav button[aria-current=&quot;page&quot;]{background:var(--u-selected);border-color:#5c6a73;color:var(--u-text)}
#uac-revision .nav button:hover{color:var(--u-text);background:var(--u-hover)}
#uac-revision .content{flex:1;min-height:0;padding:25px 26px;overflow:auto;scrollbar-gutter:stable}
#uac-revision .content.inventory{display:flex;flex-direction:column;overflow:hidden;scrollbar-gutter:auto}
#uac-revision h2{font:22px/1.25 UACAldrich,sans-serif}
#uac-revision h3{font:14px/1.35 UACAldrich,sans-serif}
#uac-revision .heading{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex:none;margin-bottom:22px}
#uac-revision .hint{display:block;color:var(--u-muted);font-size:12px;line-height:1.5;margin-top:5px}
#uac-revision .tag{padding:4px 7px;font:11px/1.4 ui-monospace,monospace;border:1px solid var(--u-line);border-radius:3px;color:var(--u-muted);white-space:nowrap}
#uac-revision .button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:7px 11px;background:var(--u-panel);border:1px solid #58646d;border-radius:var(--u-radius);color:var(--u-text);font-size:12px;text-decoration:none;white-space:nowrap}
#uac-revision .button:hover{background:var(--u-hover)}
#uac-revision .button.quiet{border-color:transparent;background:none;color:var(--u-muted)}
#uac-revision .button.primary{background:var(--u-accent);border-color:var(--u-accent);color:#11272e;font-weight:600}
#uac-revision .button:disabled{opacity:.4}
#uac-revision .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#uac-revision .control{width:100%;min-width:0;color:var(--u-text);background:var(--u-field);border:1px solid #58646d;border-radius:var(--u-radius);padding:9px 11px;min-height:39px;font-size:13px}
#uac-revision .mono{font-family:&quot;DejaVu Sans Mono&quot;,ui-monospace,monospace;font-size:12px;letter-spacing:0}
#uac-revision .label{display:block;font-size:13px;font-weight:500}
#uac-revision .group{margin-top:24px}
#uac-revision .group:first-of-type{margin-top:0}
#uac-revision .group-head{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--u-line);padding-bottom:10px}
#uac-revision .group-head small{font-size:11px;color:var(--u-muted)}
#uac-revision .setting{display:grid;grid-template-columns:minmax(0,1fr) minmax(155px,40%);align-items:center;gap:22px;min-height:68px;padding:13px 0;border-bottom:1px solid var(--u-line)}
#uac-revision .setting:last-child{border:0}
#uac-revision .stack{display:flex;flex-direction:column;gap:7px;min-width:0}
#uac-revision .text-link{border:0;background:none;padding:0;color:var(--u-accent);font-size:12px;text-align:right;text-decoration:underline;text-underline-offset:3px}
#uac-revision .switch{justify-self:end;position:relative;width:38px;height:22px;appearance:none;background:#45515b;border:1px solid #77828b;border-radius:20px;margin:0}
#uac-revision .switch:checked{background:var(--u-accent);border-color:var(--u-accent)}
#uac-revision .switch:after{content:&quot;&quot;;position:absolute;top:2px;left:2px;width:16px;height:16px;background:#eef2f0;border-radius:50%}
#uac-revision .switch:checked:after{left:18px;background:#16343e}
#uac-revision .range{display:flex;align-items:center;gap:14px;font-size:12px}
#uac-revision .range input{width:100%;min-width:0;accent-color:var(--u-accent)}
#uac-revision .segments{display:flex;border:1px solid #58646d;border-radius:var(--u-radius);padding:3px;background:var(--u-field)}
#uac-revision .segments button{flex:1;border:0;background:none;color:var(--u-muted);border-radius:3px;padding:7px;font-size:12px}
#uac-revision .segments button[aria-pressed=&quot;true&quot;]{background:var(--u-selected);color:var(--u-text)}
#uac-revision .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;margin-bottom:18px;flex:none;flex-wrap:wrap}
#uac-revision .toolbar .hint{margin:0}
#uac-revision .resource-layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,40%) minmax(0,60%);border:1px solid var(--u-line);border-radius:var(--u-radius);overflow:hidden}
#uac-revision .library{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--u-line)}
#uac-revision .panel-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;height:42px;padding:10px 13px;border-bottom:1px solid var(--u-line);background:var(--u-panel);font-size:12px;color:var(--u-muted)}
#uac-revision .resource-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:5px}
#uac-revision .resource{width:100%;min-height:65px;display:grid;grid-template-columns:minmax(0,1fr) 54px;align-items:center;gap:8px;text-align:left;padding:10px;border:1px solid transparent;border-radius:4px;background:none;color:var(--u-text)}
#uac-revision .resource+.resource{margin-top:2px}
#uac-revision .resource:hover{background:var(--u-hover)}
#uac-revision .resource.selected{background:var(--u-selected)}
#uac-revision .resource .name{font-size:13px;font-weight:500;display:block;overflow-wrap:anywhere}
#uac-revision .resource .sub{display:block;color:var(--u-muted);font-size:11px;margin-top:4px}
#uac-revision .resource-copy{min-width:0}
#uac-revision .resource.game{grid-template-columns:27px minmax(0,1fr) 54px}
#uac-revision .resource img{width:25px;height:30px;object-fit:contain;image-rendering:pixelated}
#uac-revision .default-slot{width:54px;min-width:54px;height:22px;display:flex;align-items:center;justify-content:flex-end}
#uac-revision .badge{font-size:10px;line-height:1.4;padding:3px 5px;background:var(--u-panel);border:1px solid #5b6a74;border-radius:3px;color:var(--u-text);white-space:nowrap}
#uac-revision .inspector{display:flex;flex-direction:column;min-width:0;min-height:0}
#uac-revision .inspector-fields{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:18px}
#uac-revision .editor-title{display:flex;align-items:center;gap:12px;min-height:56px;margin-bottom:17px}
#uac-revision .editor-title img{width:43px;height:43px;object-fit:contain;image-rendering:pixelated}
#uac-revision .engine-symbol{width:43px;height:43px;display:flex;align-items:center;justify-content:center;background:var(--u-panel);border:1px solid var(--u-line);border-radius:5px;flex:none}
#uac-revision .engine-symbol svg{width:22px;height:22px}
#uac-revision .editor-title h3{font-size:17px;overflow-wrap:anywhere}
#uac-revision .default-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px 0;margin-bottom:6px;border-top:1px solid var(--u-line);border-bottom:1px solid var(--u-line)}
#uac-revision .default-row .hint{font-size:11px;line-height:1.3;margin:0;max-width:140px}
#uac-revision .default-control{width:139px;min-width:139px;height:36px;min-height:36px;padding:7px 10px}
#uac-revision .default-control[aria-disabled=&quot;true&quot;]{color:var(--u-muted);background:var(--u-panel);border-color:var(--u-line)}
#uac-revision .field{display:block;margin-top:17px}
#uac-revision .field .label{margin-bottom:6px}
#uac-revision .field .control{display:block}
#uac-revision .editor-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--u-line)}
#uac-revision .text-path{display:block;overflow-wrap:anywhere;user-select:text;color:var(--u-muted);font:12px/1.65 &quot;DejaVu Sans Mono&quot;,monospace}
#uac-revision .info-line{flex:none;display:flex;align-items:center;gap:9px;margin-top:14px;color:var(--u-muted);font-size:11px;min-height:25px}
#uac-revision .info-line svg{width:14px;height:14px}
#uac-revision .back{display:none}
#uac-revision .path-row{padding:21px 0;border-bottom:1px solid var(--u-line)}
#uac-revision .path-row:first-of-type{padding-top:0}
#uac-revision .path-top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:8px}
#uac-revision .path-top .label{font:14px UACAldrich,sans-serif}
#uac-revision .path-status{font-size:11px;color:var(--u-muted)}
#uac-revision .path-value{display:flex;gap:16px;align-items:center;justify-content:space-between}
#uac-revision .path-value .text-path{color:var(--u-text);min-width:0}
#uac-revision .path-value .actions{flex-shrink:0;gap:4px}
#uac-revision .path-input-row{display:flex;gap:8px;align-items:center}
#uac-revision .path-input-row .control{flex:1;min-width:0}
#uac-revision .path-sub{display:flex;justify-content:space-between;gap:12px;margin-top:7px;align-items:flex-start}
#uac-revision .path-sub .hint{margin:0}
#uac-revision .path-sub .text-link{font-size:11px;white-space:nowrap;color:var(--u-muted)}
